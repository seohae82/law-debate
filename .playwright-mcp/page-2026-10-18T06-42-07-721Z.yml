            - text: "상황: 수업 시간마다 학생들이 휴대전화를 일괄 수거하는 학교 규칙이 있습니다. 학생들은 사생활의 비밀과 통신의 자유가 침해된다고 느끼고, 학교는 수업 집중과 생활지도를 위해 필요하다고 주장합니다. 이 규칙이 학생의 기본권과 학교의 공익 사이에서 어떻게 균형을 이루어야 하는지 토론해 보세요. 토론 범위: 이 주제는 학교의 휴대전화 일괄 수거가 학생의 사생활·통신의 비밀과 표현의 자유를 침해하는지, 아니면 수업 집중과 생활지도라는 학교 공익을 위해 정당화될 수 있는지를 헌법 제10조, 제17조, 제18조, 제21조, 제37조 등의 관점에서 균형 있게 살펴보는 토론입니다. 학생의 기본권 보호와 학교의 교육적 필요 사이에서 어느 한쪽을 무조건 옳다고 단정하지 않고, 제한의 필요성과 한계, 절차적 정당성을 함께 고려합니다. 관련 헌법 조항: 제17조 제17조 · 사생활의 비밀과 자유 · 제18조 제18조 · 통신의 비밀 · 제16조 제16조 · 주거의 자유 · 제12조 제12조 · 신체의 자유와 적법절차 · 제37조 제37조 · 기본권 보장과 제한의 한계 토론 질문: 1. 학교의 일괄 휴대전화 수거가 수업 집중과 생활지도라는 공익을 위해 필요하다면, 학생의 사생활·통신의 비밀과 같은 기본권은 어느 범위에서 제한될 수 있다고 보는지 생각해 보세요. 2. 만약 학교가 수거한 휴대전화를 수업 시간 외에는 사용할 수 있게 하거나, 학생의 동의와"
